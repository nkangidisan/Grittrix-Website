<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account | Grittrix Pay</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="src/app/services/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    .auth-container { display: flex; min-height: 100vh; }
    .auth-sidebar { flex: 1; background: var(--bg-secondary); display: flex; flex-direction: column; justify-content: center; padding: 60px; position: relative; overflow: hidden; }
    .auth-form-side { flex: 1; background: var(--bg-card); display: flex; flex-direction: column; justify-content: center; padding: 60px; }
    .auth-card { max-width: 450px; width: 100%; margin: 0 auto; }
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .input-group input { width: 100%; background: var(--bg-primary); border: 1px solid var(--border); padding: 14px; border-radius: 10px; color: white; font-size: 1rem; transition: border-color 0.2s; }
    .input-group input:focus { border-color: var(--accent-primary); outline: none; }
    @media (max-width: 768px) { .auth-container { flex-direction: column; } .auth-sidebar { padding: 40px 20px; height: auto; flex: none; } }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-sidebar">
      <div class="auth-logo" style="margin-bottom: 40px;">
        <a href="index.html" class="logo-lockup">
          <div class="logo-icon-wrap" style="width:52px; height:52px; border-radius:14px;">
            <img src="src/app/services/logo.png" alt="Grittrix Pay" class="logo-icon" style="width:30px;">
          </div>
          <span class="logo-text" style="font-size:1.6rem;">Grittrix <span class="logo-product">Pay</span></span>
        </a>
      </div>
      <h2 style="font-size: 2.5rem; margin-bottom: 20px;">Get paid in under <span style="color: var(--accent-primary)">10 seconds.</span></h2>
      <p style="color: var(--text-muted);">Step 1: Account Type → Step 2: Details → Step 3: Verify</p>
      
      <div style="margin-top: 60px;">
        <div class="floating-card" style="position:relative; left:0; top:0; margin-bottom: 20px;">✅ Payment received · 120,000 UGX</div>
        <div class="floating-card" style="position:relative; left:20px; top:0; margin-bottom: 20px;">⚡ STK Push sent · 0.3s</div>
      </div>
    </div>

    <div class="auth-form-side">
      <div class="auth-card">
        <h3 style="font-size: 2rem; margin-bottom: 8px;">Create an account</h3>
        <p style="color: var(--text-muted); margin-bottom: 40px;">Start your journey with Uganda's fastest payment platform.</p>

        <form id="signup-form">
          <div class="input-group">
            <label>Full Name</label>
            <input type="text" placeholder="e.g. Sarah Kyolaba" required>
          </div>
          <div class="input-group">
            <label>Email Address</label>
            <input type="email" placeholder="sarah@example.com" required>
          </div>
          <div class="input-group">
            <label>Phone Number (MTN/Airtel)</label>
            <input type="tel" placeholder="+256 7XX XXX XXX" required>
          </div>
          <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="••••••••" required>
          </div>
          
          <button type="submit" class="btn-mint" style="width: 100%; margin-top: 10px;">Create My Account →</button>
        </form>

        <div style="text-align: center; margin: 30px 0; color: var(--text-muted); font-size: 0.9rem;">
          Already have an account? <a href="login.html" style="color: var(--accent-primary); text-decoration: none;">Sign in →</a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
