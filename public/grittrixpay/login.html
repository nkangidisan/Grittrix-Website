<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Grittrix Pay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div style="display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh;">
        <!-- Left Panel -->
        <div style="background: var(--bg-secondary); padding: 4rem; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden;">
            <div style="position: relative; z-index: 10;">
                <a href="index.html" class="logo" style="font-size: 2rem; margin-bottom: 2rem;">Grittrix<span>Pay</span></a>
                <h1 style="font-size: 3rem; line-height: 1.1; margin-bottom: 1.5rem;">Your business.<br>Your payments.<br>Your data.</h1>
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                    <div style="background: var(--bg-card); padding: 1rem; border-radius: 12px; border: 1px solid var(--accent-primary); font-size: 0.85rem; width: fit-content; animation: floatY 4s infinite ease-in-out;">✅ Payment received · 120k</div>
                    <div style="background: var(--bg-card); padding: 1rem; border-radius: 12px; border: 1px solid var(--border); font-size: 0.85rem; width: fit-content; animation: floatY 5s infinite ease-in-out; margin-left: 2rem;">⚡ STK Push sent · 0.3s</div>
                </div>
            </div>
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.1; background: radial-gradient(circle at center, var(--accent-primary), transparent 70%);"></div>
        </div>

        <!-- Right Panel -->
        <div style="background: var(--bg-primary); padding: 4rem; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <div style="width: 100%; max-width: 400px;">
                <h2 style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome back</h2>
                <p style="color: var(--text-muted); margin-bottom: 2.5rem;">Sign in to your Grittrix Pay account</p>
                
                <form id="login-form" style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div>
                        <label style="display: block; font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--text-muted);">Email Address</label>
                        <input type="email" required style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border); padding: 1rem; border-radius: 12px; color: #fff; outline: none; transition: 0.3s;" placeholder="name@company.com">
                    </div>
                    <div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <label style="font-size: 0.85rem; color: var(--text-muted);">Password</label>
                            <a href="#" style="font-size: 0.85rem; color: var(--accent-primary);">Forgot password?</a>
                        </div>
                        <input type="password" required style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border); padding: 1rem; border-radius: 12px; color: #fff; outline: none; transition: 0.3s;">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 1rem;">Sign In →</button>
                </form>

                <div style="margin: 2rem 0; display: flex; align-items: center; gap: 1rem; color: var(--text-muted); font-size: 0.8rem;">
                    <div style="flex-grow: 1; height: 1px; background: var(--border);"></div>
                    OR CONTINUE WITH
                    <div style="flex-grow: 1; height: 1px; background: var(--border);"></div>
                </div>

                <button class="btn btn-ghost" style="width: 100%; justify-content: center; border: 1px solid var(--border); padding: 1rem;">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="18" style="margin-right: 0.5rem;">
                    Continue with Google
                </button>

                <p style="text-align: center; margin-top: 2.5rem; color: var(--text-muted); font-size: 0.9rem;">
                    Don't have an account? <a href="signup.html" style="color: var(--accent-primary); font-weight: 700;">Sign up →</a>
                </p>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => input.style.borderColor = 'var(--accent-primary)');
            input.addEventListener('blur', () => input.style.borderColor = 'var(--border)');
        });
    </script>
</body>
</html>
