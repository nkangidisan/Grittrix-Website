<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Grittrix Pay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { display: flex; min-height: 100vh; background: var(--bg-primary); }
    .auth-left {
      flex: 1;
      background: var(--bg-secondary);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px;
      position: relative;
      overflow: hidden;
    }
    .auth-right {
      width: 500px;
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--bg-card);
      border-left: 1px solid var(--border);
    }
    .form-group { margin-bottom: 24px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); }
    input {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 12px;
      color: var(--text-primary);
      font-family: inherit;
      transition: var(--transition-smooth);
    }
    input:focus { border-color: var(--accent-primary); outline: none; }
    .divider {
      text-align: center;
      margin: 32px 0;
      position: relative;
      color: var(--text-muted);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--border);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    @media (max-width: 900px) {
      .auth-left { display: none; }
      .auth-right { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="auth-left">
    <a href="index.html" class="logo" style="margin-bottom: 40px;">Grittrix<span>Pay</span></a>
    <h2 style="font-size: 48px; margin-bottom: 24px;">Your business.<br>Your payments.<br>Your data.</h2>
    <div class="notification-float" style="position: static; margin-bottom: 16px; width: fit-content;">✅ Payment received · 120,000 UGX</div>
    <div class="notification-float" style="position: static; margin-bottom: 16px; width: fit-content; margin-left: 40px;">⚡ STK Push sent · 0.3s</div>
    <div class="notification-float" style="position: static; width: fit-content; margin-left: 20px;">📱 MTN MoMo · Confirmed</div>
  </div>

  <div class="auth-right">
    <h1 style="margin-bottom: 8px;">Welcome back.</h1>
    <p style="color: var(--text-muted); margin-bottom: 40px;">Sign in to your Grittrix Pay account.</p>
    
    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="name@company.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
        <div style="text-align: right; margin-top: 8px;">
          <a href="#" style="font-size: 12px; color: var(--accent-primary);">Forgot password?</a>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Sign In →</button>
      <div id="error-message" style="color: var(--accent-secondary); font-size: 12px; margin-top: 16px; text-align: center;"></div>
    </form>

    <div class="divider">or continue with</div>

    <button id="google-signin" class="btn btn-ghost" style="width: 100%; justify-content: center; gap: 12px;">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="18" height="18" alt="Google">
      Sign In with Google
    </button>

    <p style="text-align: center; margin-top: 40px; font-size: 14px; color: var(--text-muted);">
      Don't have an account? <a href="signup.html" style="color: var(--accent-primary); font-weight: 600;">Sign up →</a>
    </p>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script>
    // REPLACE WITH YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      try {
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = 'dashboard.html'; // Redirect to dashboard
      } catch (error) {
        errorEl.innerText = error.message;
      }
    });

    document.getElementById('google-signin').addEventListener('click', async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
        window.location.href = 'dashboard.html';
      } catch (error) {
        errorEl.innerText = error.message;
      }
    });
  </script>
</body>
</html>
