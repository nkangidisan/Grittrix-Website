<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Grittrix Pay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="auth-split">
        <div class="auth-left">
            <a href="index.html" class="nav-logo">
                <img src="/favicon.ico" alt="Grittrix Icon">
                <span>Grittrix <span class="pay-text">Pay</span></span>
            </a>
            <div>
                <h1 style="font-size: 3rem; margin-bottom: 24px;">Your business. Your payments. Your data.</h1>
                <p style="color: var(--text-muted);">Join thousands of Ugandan businesses scaling with intelligent mobile money checkouts.</p>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-muted);">© 2025 Grittrix Pay</p>
        </div>

        <div class="auth-right">
            <!-- Mobile Header -->
            <div style="position: absolute; top: 20px; left: 24px; display: none;" class="mobile-logo-header">
                <a href="index.html" class="nav-logo">
                    <img src="/favicon.ico" alt="Grittrix Icon">
                    <span>Grittrix <span class="pay-text">Pay</span></span>
                </a>
            </div>

            <div class="auth-card">
                <h2 style="margin-bottom: 8px;">Welcome back</h2>
                <p style="color: var(--text-muted); margin-bottom: 32px; font-size: 0.9rem;">Sign in to your Grittrix Pay account</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-input" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between;">
                            <label>Password</label>
                            <a href="#" style="font-size: 0.75rem; color: var(--accent-primary);">Forgot password?</a>
                        </div>
                        <input type="password" class="form-input" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">Sign In →</button>
                </form>

                <div style="margin: 32px 0; text-align: center; color: var(--text-muted); font-size: 0.8rem; position: relative;">
                    <span style="background: var(--bg-primary); padding: 0 10px; position: relative; z-index: 1;">or continue with</span>
                    <hr style="position: absolute; top: 50%; width: 100%; border: 0; border-top: 1px solid var(--border);">
                </div>

                <button class="btn btn-ghost" style="width: 100%; justify-content: center;">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" alt="Google" style="height: 18px; margin-right: 8px;">
                    Google
                </button>

                <p style="text-align: center; margin-top: 32px; font-size: 0.9rem; color: var(--text-muted);">
                    Don't have an account? <a href="signup.html" style="color: var(--accent-primary); font-weight: 600;">Sign up →</a>
                </p>
            </div>
        </div>
    </div>

    <style>
        @media (max-width: 768px) {
            .mobile-logo-header { display: block !important; }
        }
    </style>
</body>
</html>
