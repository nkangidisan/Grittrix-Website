<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Grittrix Pay</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-grid { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
        .auth-sidebar { background: var(--bg-secondary); padding: 4rem; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
        .auth-form-container { background: var(--bg-primary); padding: 4rem; display: flex; flex-direction: column; justify-content: center; }
        .auth-form { max-width: 400px; width: 100%; margin: 0 auto; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted); }
        .form-group input { width: 100%; padding: 1rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; color: white; font-family: var(--font-body); outline: none; transition: border-color 0.3s; }
        .form-group input:focus { border-color: var(--accent-primary); }
        @media (max-width: 768px) {
            .auth-grid { grid-template-columns: 1fr; }
            .auth-sidebar { display: none; }
        }
    </style>
</head>
<body>

    <div class="auth-grid">
        <div class="auth-sidebar">
            <a href="index.html" class="logo" style="position: absolute; top: 4rem; left: 4rem;">Grittrix<span>Pay</span></a>
            <h2 style="font-size: 3.5rem; line-height: 1; margin-bottom: 2rem;">Your business. <br>Your payments. <br><span style="color: var(--accent-primary);">Under 10s.</span></h2>
            <p style="color: var(--text-muted); font-size: 1.1rem; max-width: 400px;">Access your dashboard and manage your mobile money payments from one central place.</p>
        </div>

        <div class="auth-form-container">
            <div class="auth-form reveal visible">
                <h2 style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome back</h2>
                <p style="color: var(--text-muted); margin-bottom: 2.5rem;">Sign in to your Grittrix Pay account</p>
                
                <form id="login-form">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="you@company.com" required>
                    </div>
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between;">
                            <label>Password</label>
                            <a href="#" style="font-size: 0.8rem; color: var(--accent-primary);">Forgot password?</a>
                        </div>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In <i class="fas fa-arrow-right"></i></button>
                    
                    <div style="text-align: center; margin: 2rem 0; color: var(--text-muted); font-size: 0.9rem; position: relative;">
                        <span style="background: var(--bg-primary); padding: 0 1rem; position: relative; z-index: 2;">or continue with</span>
                        <div style="position: absolute; top: 50%; width: 100%; height: 1px; background: var(--border); z-index: 1;"></div>
                    </div>
                    
                    <button type="button" class="btn btn-ghost" style="width: 100%; gap: 0.75rem;">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="18" height="18">
                        Sign in with Google
                    </button>
                </form>
                
                <p style="margin-top: 2rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
                    Don't have an account? <a href="signup.html" style="color: var(--accent-primary); font-weight: 600;">Sign up →</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        // REPLACE WITH YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Auth logic here
        });
    </script>
</body>
</html>
