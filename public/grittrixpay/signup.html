<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Grittrix Pay</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
</head>
<body style="display:flex; height:100vh; background:var(--bg-secondary);">
  <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px;">
    <div style="width:100%; max-width:400px; background:var(--bg-card); padding:40px; border-radius:24px; border:1px solid var(--border);">
      <div style="text-align:center; margin-bottom:32px;">
        <a href="index.html" class="logo-lockup" style="flex-direction:column;">
          <div class="logo-icon-wrap" style="width:52px; height:52px;"><img src="/media/disanlogo.png" class="logo-icon" style="width:30px; height:30px;"></div>
          <span class="logo-text" style="font-size:1.5rem; margin-top:10px;">Grittrix Pay</span>
        </a>
      </div>
      <h2 style="margin-bottom:24px; font-family:var(--font-heading);">Create Account</h2>
      <input type="text" placeholder="Full Name" style="width:100%; padding:14px; background:var(--bg-primary); border:1px solid var(--border); border-radius:10px; color:white; margin-bottom:16px;">
      <input type="email" placeholder="Email" style="width:100%; padding:14px; background:var(--bg-primary); border:1px solid var(--border); border-radius:10px; color:white; margin-bottom:16px;">
      <input type="password" placeholder="Password" style="width:100%; padding:14px; background:var(--bg-primary); border:1px solid var(--border); border-radius:10px; color:white; margin-bottom:24px;">
      <button class="btn-primary-sm" style="width:100%; padding:16px;">Get Started →</button>
      <p style="text-align:center; margin-top:20px; font-size:0.9rem; opacity:0.6;">Already have an account? <a href="login.html" style="color:var(--accent-primary); text-decoration:none;">Login</a></p>
    </div>
  </div>
</body>
</html>
