<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Grittrix Pay</title>
    <link rel="icon" href="src/app/services/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-split { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
        .auth-marketing { background: var(--bg-secondary); padding: 80px; display: flex; flex-direction: column; justify-content: center; }
        .auth-form-panel { background: var(--bg-card); padding: 80px; display: flex; flex-direction: column; justify-content: center; }
        .step-card { background: #050508; border: 1px solid var(--border); padding: 24px; border-radius: 12px; margin-bottom: 16px; cursor: pointer; transition: all 0.2s ease; }
        .step-card.active { border-color: var(--accent-primary); box-shadow: 0 0 15px rgba(0, 229, 160, 0.15); }
        @media (max-width: 767px) { .auth-split { grid-template-columns: 1fr; } .auth-marketing { display: none; } .auth-form-panel { padding: 40px 20px; } }
    </style>
</head>
<body>
    <div class="auth-split">
        <div class="auth-marketing">
            <a href="index.html" class="logo-lockup">
                <div class="logo-icon-wrap"><img src="src/app/services/favicon.ico" alt="" class="logo-icon" width="32" height="32"></div>
                <span class="logo-text"><span class="logo-brand">Grittrix</span><span class="logo-product"> Pay</span></span>
            </a>
            <h1 class="text-h1" style="margin-top: 40px;">Get paid in under <span class="text-accent">10 seconds.</span></h1>
        </div>
        
        <div class="auth-form-panel">
            <div class="auth-logo" style="text-align:center; margin-bottom: 32px;">
                <a href="index.html" class="logo-lockup" style="flex-direction: column; gap: 8px;">
                    <div class="logo-icon-wrap" style="width:52px; height:52px; border-radius:14px;">
                        <img src="src/app/services/favicon.ico" alt="Grittrix Pay" class="logo-icon" width="30" height="30">
                    </div>
                    <span class="logo-text" style="font-size:1.5rem;"><span class="logo-brand">Grittrix</span><span class="logo-product"> Pay</span></span>
                </a>
            </div>

            <h2 class="text-h3" style="text-align:center; margin-bottom: 32px;">Create your account</h2>
            
            <div id="step1">
                <p class="text-muted" style="margin-bottom: 24px; text-align:center;">How will you use Grittrix Pay?</p>
                <div class="step-card active">
                    <h4 class="text-accent">🏪 Business Owner</h4>
                    <p class="text-muted" style="font-size: 0.9rem;">I want to receive payments, create links, and track transactions.</p>
                </div>
                <div class="step-card">
                    <h4 class="text-primary">👤 Customer</h4>
                    <p class="text-muted" style="font-size: 0.9rem;">I want to pay businesses quickly without USSD stress.</p>
                </div>
                <button class="btn-primary-sm" style="width:100%; padding: 16px; margin-top: 16px;">Continue →</button>
            </div>
            
            <p style="text-align:center; margin-top: 24px; color: var(--text-muted);">Already have an account? <a href="login.html" class="text-accent">Sign in →</a></p>
        </div>
    </div>
</body>
</html>
