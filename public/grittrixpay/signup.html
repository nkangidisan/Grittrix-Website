<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Grittrix Pay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="auth-split">
        <div class="auth-left">
            <a href="index.html" class="nav-logo">
                <img src="/favicon.ico" alt="Grittrix Icon">
                <span>Grittrix <span class="pay-text">Pay</span></span>
            </a>
            <div>
                <h1 style="font-size: 3rem; margin-bottom: 24px;">Get paid in under 10 seconds.</h1>
                <p style="color: var(--text-muted);">Simple. Unified. Professional. The payment layer for modern Ugandan commerce.</p>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-muted);">© 2025 Grittrix Pay</p>
        </div>

        <div class="auth-right">
             <!-- Mobile Header -->
             <div style="position: absolute; top: 20px; left: 24px; display: none;" class="mobile-logo-header">
                <a href="index.html" class="nav-logo">
                    <img src="/favicon.ico" alt="Grittrix Icon">
                    <span>Grittrix <span class="pay-text">Pay</span></span>
                </a>
            </div>

            <div class="auth-card">
                <h2 style="margin-bottom: 8px;">Create account</h2>
                <p style="color: var(--text-muted); margin-bottom: 32px; font-size: 0.9rem;">Join the future of payments in Uganda.</p>

                <form id="signupForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" class="form-input" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-input" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" class="form-input" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">Create Account →</button>
                </form>

                <p style="text-align: center; margin-top: 32px; font-size: 0.9rem; color: var(--text-muted);">
                    Already have an account? <a href="login.html" style="color: var(--accent-primary); font-weight: 600;">Sign in →</a>
                </p>
            </div>
        </div>
    </div>

    <style>
        @media (max-width: 768px) {
            .mobile-logo-header { display: block !important; }
        }
    </style>
</body>
</html>
