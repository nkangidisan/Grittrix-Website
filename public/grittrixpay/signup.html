<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Grittrix Pay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-split { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
    .auth-visual { background: var(--bg-secondary); display: flex; align-items: center; justify-content: center; padding: 4rem; }
    .auth-form-side { display: flex; align-items: center; justify-content: center; padding: 4rem; background: var(--bg-primary); }
    .auth-box { width: 100%; max-width: 400px; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
    input { width: 100%; padding: 1rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 0.5rem; color: white; transition: var(--transition); }
    input:focus { border-color: var(--accent-primary); outline: none; }
    @media (max-width: 768px) { .auth-split { grid-template-columns: 1fr; } .auth-visual { display: none; } }
  </style>
</head>
<body>

  <div class="auth-split">
    <div class="auth-visual">
       <div>
         <a href="index.html" class="logo">Grittrix <span>Pay</span></a>
         <h2 style="font-size: 3rem; margin-top: 2rem;">Join the future.</h2>
         <p class="text-muted"> Ugandan businesses grow faster with Grittrix Pay.</p>
       </div>
    </div>
    <div class="auth-form-side">
       <div class="auth-box">
          <h2 style="margin-bottom: 2rem;">Create Account</h2>
          <form id="signup-form">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" placeholder="John Doe" required>
            </div>
            <div class="form-group">
              <label>Business Name</label>
              <input type="text" placeholder="My Awesome Shop" required>
            </div>
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" placeholder="name@company.com" required>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account →</button>
          </form>
          <div style="margin-top: 2rem; text-align: center;">
            <p class="text-muted">Already have an account? <a href="login.html" class="text-mint">Sign in</a></p>
          </div>
       </div>
    </div>
  </div>

</body>
</html>
